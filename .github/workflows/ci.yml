# GearLogs website — build + internal-link integrity on every PR and on main (HYG-2, 2026-08-21).
# Cloudflare Pages deploys main on merge; this is the gate in front of it.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-check:
    name: build · link integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install (clean, lockfile-exact)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Internal links + sitemap resolve, clean-URL form only
        run: npm run check:links
