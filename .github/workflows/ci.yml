# GearLogs website — build + internal-link integrity on every PR and on main (HYG-2, 2026-08-21).
# Cloudflare Pages deploys main on merge; this is the gate in front of it.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-check:
    name: the full check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install (clean, lockfile-exact)
        run: npm ci

      # the same gauntlet as local: the typed scripts, the contact rules, the build (which refuses inline code and writes
      # _headers from the policies), links + anchors, the bilingual check (Stage 2 PR-1)
      - name: The full check
        run: npm run check
        env:
          CHROME: /usr/bin/google-chrome   # the CSP walk drives the runner's Chrome (it never skips silently)
