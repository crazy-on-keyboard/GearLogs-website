# After a release (Cloudflare Pages deploys main), tell the IndexNow engines which pages changed (SEO-1 · D2 · A, 2026-10-02).
# "Changed" = the page's day in scripts/lib/page-dates.json moved since the previous main; the script waits for the live sitemap
# to carry the new date (the deploy is live) before it pings, and a failed ping never fails the job.
name: IndexNow

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ping:
    name: tell the engines what changed
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2   # the previous main's snapshot is read with `git show <before>:…`

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Ping the changed pages
        continue-on-error: true   # a ping is a courtesy: the engines read the sitemap's dates anyway
        run: node scripts/indexnow.mjs --before "${{ github.event.before }}"
